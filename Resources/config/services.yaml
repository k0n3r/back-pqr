# Este archivo es el punto de entrada de la configuración de servicios del módulo.
# https://symfony.com/doc/current/service_container.html

services:
  # Configuración por defecto para los servicios en este módulo
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    bind:
      $projectDir: '%kernel.project_dir%'
      $domain: '%env(APP_DOMAIN)%'

  # Hace que las clases de este namespace estén disponibles como servicios.
  App\Bundles\pqr\:
    resource: '../../*'
    exclude:
      - '../../Resources/'
      - '../../templates/'
      - '../../translations/'
      - '../../formatos/'
      - '../../helpers/'
      - '../../Services/models/'
      - '../../Services/controllers/'
      - '../../Services/generadoresWs/'
      - '../../Services/Customizable/'
      - '../../Services/crontab/'
      - '../../Service/PqrFormFieldService.php'
      - '../../IA/'

  # Públicos para acceso dinámico desde clases FT (via LegacyServiceLocator::get()), evitar uso (Usado para migracion legacy)
  App\Bundles\pqr\Service\PqrService:
    public: true

  App\Bundles\pqr\Service\PqrFormFieldServiceFactory:
    public: true

  App\Bundles\pqr\Service\PqrHistoryService:
    public: true

  App\Bundles\pqr\Services\crontab\:
    resource: '../../Services/crontab/'

imports:
  - { resource: "./migrations.yaml" }
  - { resource: "./ia_services.php" }
